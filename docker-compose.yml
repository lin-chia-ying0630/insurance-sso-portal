services:
  portal-sso-dev:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine-slim
    container_name: insurance-sso-portal-dev-sso
    volumes:
      - ./docker/mock-sso.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  insurance-sso-portal:
    build:
      context: .
    container_name: insurance-sso-portal
    environment:
      SSO_UPSTREAM: ${SSO_UPSTREAM:-http://portal-sso-dev:8080}
    depends_on:
      portal-sso-dev:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5174:8080"
    restart: unless-stopped
