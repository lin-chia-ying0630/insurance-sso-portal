services:
  portal-sso-dev:
    build: ./docker/mock-sso
    container_name: insurance-sso-portal-dev-sso
    environment:
      SSO_ISSUER: ${SSO_ISSUER:-http://192.168.1.104:8083}
      PORTAL_URL: ${PORTAL_URL:-http://192.168.1.104:5174/}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  insurance-sso-portal:
    build:
      context: .
    container_name: insurance-sso-portal
    environment:
      SSO_UPSTREAM: ${SSO_UPSTREAM:-http://portal-sso-dev:8080}
    depends_on:
      portal-sso-dev:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5174:8080"
    restart: unless-stopped
