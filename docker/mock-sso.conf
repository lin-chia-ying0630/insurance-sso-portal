server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 只供本機 docker compose 驗證入口畫面，不會被複製進 production image。
    location = /api/auth/me {
        default_type application/json;
        add_header Cache-Control 'no-store';
        return 200 '{"authenticated":true,"user":{"userId":"local-demo","displayName":"本機使用者","department":"本機 Docker","applicationKeys":["NEW_CONTRACT","POLICY_SERVICE"]}}';
    }

    location / {
        return 404;
    }
}
